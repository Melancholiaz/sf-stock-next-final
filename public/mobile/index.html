<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1B63AF">
    <link rel="manifest" href="/mobile/manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="SF Stock">
    <title>SF Stock Mobile</title>
    <link rel="icon" href="/icon.jpg">
    <link rel="apple-touch-icon" href="/mobile/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sf: #1B63AF; --sf-deep: #144C88; --sf-tint: #EAF2FB; --sf-tint-2: #D6E6F7;
            --bg: #F3F6FA; --card: #FFFFFF; --ink: #0F1E33; --muted: #66768C; --line: #E1E8F1;
            --ok: #12A150; --ok-tint: #E7F6EE; --danger: #D64545; --danger-tint: #FDECEC;
            --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; }
        body { font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); touch-action: manipulation; font-variant-numeric: tabular-nums; }
        button { font: inherit; cursor: pointer; }
        input { font: inherit; }
        .hidden { display: none; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        /* ---------- หน้าเมนู ---------- */
        .screen { min-height: 100vh; min-height: 100dvh; width: 100%; flex-direction: column; padding: calc(var(--safe-top) + 28px) 20px calc(var(--safe-bottom) + 28px); }
        #menuScreen { display: none; }

        /* ---------- ล็อกอิน ---------- */
        #loginScreen { display: none; justify-content: center; }
        .login-card { width: 100%; max-width: 380px; margin: 0 auto; }
        .login-card .brand { margin-bottom: 24px; }
        .login-card .field input#login_pin { font-size: 24px; letter-spacing: .4em; text-align: center; }
        .login-err { background: var(--danger-tint); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; display: none; }
        .login-hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 14px; }

        .user-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 20px; font-size: 14px; }
        .user-row b { color: var(--sf-deep); }
        .role-tag { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sf-tint); color: var(--sf-deep); margin-left: 6px; }
        .link-btn { background: none; border: none; color: var(--danger); font-weight: 600; font-size: 14px; padding: 4px 6px; }

        /* ---------- สถานะการส่งข้อมูล ---------- */
        #syncPill { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--safe-bottom) + 84px); z-index: 65; display: none; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; white-space: nowrap; box-shadow: 0 6px 20px rgba(15,30,51,.18); }
        #syncPill.offline { display: flex; background: #FFF1D6; color: #8A5200; border: 1px solid #F5D9A3; }
        #syncPill.sending { display: flex; background: #fff; color: var(--sf-deep); border: 1px solid var(--line); }
        #syncPill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .brand img { width: 52px; height: 52px; border-radius: 14px; background: #fff; border: 1px solid var(--line); object-fit: cover; }
        .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
        .brand p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
        .section-label { font-size: 14px; color: var(--muted); margin: 0 0 12px 2px; }

        .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; text-align: left; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; color: var(--ink); transition: transform .12s, border-color .12s; }
        .tile:active { transform: scale(.97); border-color: var(--sf-tint-2); }
        .tile .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--sf-tint); color: var(--sf); display: flex; align-items: center; justify-content: center; }
        .tile .ic svg { width: 24px; height: 24px; }
        .tile .t { font-size: 18px; font-weight: 700; margin-top: 14px; }
        .tile .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
        .tile.primary { background: var(--sf); border-color: var(--sf); color: #fff; }
        .tile.primary .ic { background: rgba(255,255,255,.16); color: #fff; }
        .tile.primary .s { color: rgba(255,255,255,.8); }

        /* ---------- เมนูย่อย ---------- */
        .back-link { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--sf); font-weight: 600; font-size: 15px; padding: 6px 0; margin-bottom: 18px; align-self: flex-start; }
        .back-link svg { width: 20px; height: 20px; }
        .sub-title { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
        .sub-desc { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
        .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
        .list-row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; background: none; border: none; border-bottom: 1px solid var(--line); text-align: left; color: var(--ink); }
        .list-row:last-child { border-bottom: none; }
        .list-row:active { background: var(--sf-tint); }
        .list-row .badge { width: 40px; height: 40px; border-radius: 11px; background: var(--sf-tint); color: var(--sf-deep); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex: none; }
        .list-row .lbl { flex: 1; font-size: 17px; font-weight: 600; }
        .list-row .lbl small { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); }
        .list-row .chev { width: 20px; height: 20px; color: #A0ACBD; }

        /* ---------- หน้านับสต็อก ---------- */
        #appScreen { min-height: 100vh; padding-bottom: calc(var(--safe-bottom) + 90px); }
        .app-head { position: sticky; top: 0; z-index: 20; background: var(--sf); color: #fff; padding: calc(var(--safe-top) + 10px) 12px 12px; box-shadow: 0 2px 10px rgba(20,76,136,.18); }
        .app-head-row { display: flex; align-items: center; gap: 8px; }
        .head-btn { height: 38px; min-width: 38px; padding: 0 10px; border-radius: 10px; border: none; background: rgba(255,255,255,.14); color: #fff; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        .head-btn:active { background: rgba(255,255,255,.26); }
        .head-btn svg { width: 20px; height: 20px; }
        .head-btn.add { background: #fff; color: var(--sf); }
        #zoneTitle { flex: 1; text-align: center; font-size: 17px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-row { display: flex; gap: 8px; margin-top: 12px; }
        .search-box { flex: 1; position: relative; }
        .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
        #q { width: 100%; height: 44px; border-radius: 12px; border: none; background: #fff; padding: 0 12px 0 38px; font-size: 16px; color: var(--ink); outline: none; }
        #q:focus { box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
        .scan-btn { width: 44px; height: 44px; border-radius: 12px; border: none; background: var(--sf-deep); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
        .scan-btn svg { width: 22px; height: 22px; }

        /* แถบความคืบหน้า + ตัวกรองสถานะ */
        .status-row { display: flex; gap: 6px; margin-top: 10px; }
        .chip { flex: 1; height: 38px; border-radius: 10px; border: none; background: rgba(255,255,255,.14); color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .chip b { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 12.5px; display: inline-flex; align-items: center; justify-content: center; }
        .chip.on { background: #fff; color: var(--sf-deep); }
        .chip.on b { background: var(--sf-tint); color: var(--sf-deep); }
        .chip.on.todo b { background: #FFF1D6; color: #9A5B00; }
        .chip.on.done b { background: var(--ok-tint); color: var(--ok); }
        .progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.92); }
        .progress .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,.22); overflow: hidden; }
        .progress .fill { height: 100%; width: 0; border-radius: 999px; background: #fff; transition: width .3s; }
        .progress.complete .fill { background: #7BE3A6; }

        .all-done { text-align: center; padding: 44px 20px; }
        .all-done .big { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; background: var(--ok-tint); color: var(--ok); display: flex; align-items: center; justify-content: center; }
        .all-done .big svg { width: 32px; height: 32px; }
        .all-done h4 { margin: 0 0 4px; font-size: 18px; }
        .all-done p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
        .all-done button { height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--sf); font-weight: 600; }

        #groups { padding: 4px 14px 0; }
        .grp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 4px 10px; cursor: pointer; user-select: none; }
        .grp-head .name { font-size: 14px; font-weight: 700; color: var(--sf-deep); }
        .grp-head .meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
        .grp-head svg { width: 18px; height: 18px; transition: transform .2s; }
        .grp-head.collapsed svg { transform: rotate(-90deg); }

        .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 12px; overflow: hidden; }
        .card.confirmed { border: 2px solid var(--ok); }
        .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 14px 14px 10px 16px; }
        .card-name { font-size: 16px; font-weight: 600; line-height: 1.35; }
        .card-sku { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
        .total-pill { flex: none; min-width: 48px; height: 36px; padding: 0 12px; border-radius: 999px; background: var(--sf-tint); color: var(--sf-deep); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .card.confirmed .total-pill { background: var(--ok-tint); color: var(--ok); }
        .card-body { padding: 0 14px 14px; }

        .step-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px; margin-bottom: 8px; }
        .step-row .lbl { font-size: 15px; font-weight: 600; color: #3A4A60; }
        .stepper { display: flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; height: 50px; width: 168px; flex: none; }
        .stepper button { width: 50px; height: 100%; border: none; font-size: 24px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .stepper .minus { background: var(--danger-tint); color: var(--danger); }
        .stepper .plus { background: var(--ok-tint); color: var(--ok); }
        .stepper button:active { filter: brightness(.94); }
        .stepper .val { flex: 1; text-align: center; font-size: 21px; font-weight: 700; color: var(--ink); height: 100%; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }

        .fg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .fg-cell { border-radius: 12px; padding: 8px; text-align: center; background: var(--bg); }
        .fg-cell span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; letter-spacing: .02em; }
        .fg-cell input { width: 100%; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: #fff; text-align: center; font-size: 18px; font-weight: 700; color: var(--ink); outline: none; }
        .fg-cell input:focus, .solo input:focus { border-color: var(--sf); box-shadow: 0 0 0 3px rgba(27,99,175,.15); }
        .fg-cell.machine { background: var(--sf-tint); }
        .fg-cell.machine span { color: var(--sf-deep); }
        .fg-cell.machine input { color: var(--sf-deep); border-color: var(--sf-tint-2); }
        .fg-sum { text-align: right; font-size: 13px; color: var(--muted); margin: 8px 2px 2px; }
        .fg-sum b { color: var(--sf-deep); }

        .solo { background: var(--bg); border-radius: 14px; padding: 12px; text-align: center; }
        .solo span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
        .solo input { width: 100%; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: #fff; text-align: center; font-size: 26px; font-weight: 700; color: var(--ink); outline: none; }

        .confirm-btn { width: 100%; height: 50px; margin-top: 10px; border-radius: 13px; border: none; font-size: 16px; font-weight: 700; background: var(--sf); color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .confirm-btn:active { background: var(--sf-deep); }
        .confirm-btn.done { background: var(--ok-tint); color: var(--ok); }
        .confirm-btn svg { width: 20px; height: 20px; }

        .empty { text-align: center; color: var(--muted); padding: 48px 20px; font-size: 15px; }

        /* ---------- Modal ---------- */
        .overlay { position: fixed; inset: 0; background: rgba(15,30,51,.5); z-index: 50; justify-content: center; align-items: center; padding: 16px; }
        .sheet { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; box-shadow: 0 24px 60px rgba(15,30,51,.3); }
        .sheet h3 { margin: 0 36px 16px 0; font-size: 18px; font-weight: 700; line-height: 1.35; }
        .x-btn { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--bg); color: var(--muted); font-size: 22px; line-height: 1; }
        .btn-main { width: 100%; height: 52px; border: none; border-radius: 14px; background: var(--sf); color: #fff; font-size: 17px; font-weight: 700; }
        .btn-main:active { background: var(--sf-deep); }

        .calc-panel { background: var(--sf-tint); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
        .calc-panel label { display: block; font-size: 13.5px; font-weight: 600; color: var(--sf-deep); margin-bottom: 8px; }
        .calc-panel input { width: 100%; height: 54px; border-radius: 11px; border: 1px solid var(--sf-tint-2); background: #fff; text-align: center; font-size: 22px; font-weight: 600; outline: none; }
        .calc-panel input:focus { border-color: var(--sf); }
        .calc-panel.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .calc-result-box { border: 2px solid var(--sf); border-radius: 16px; padding: 12px; text-align: center; margin-bottom: 16px; }
        .calc-result-unit { font-size: 13px; color: var(--muted); font-weight: 600; }
        .calc-result-unit.u { color: var(--sf); font-size: 15px; }
        .calc-input-huge { width: 100%; height: 72px; border: none; background: transparent; font-size: 56px; font-weight: 700; color: var(--sf-deep); text-align: center; padding: 0; outline: none; caret-color: #F59E0B; -webkit-appearance: none; border-radius: 0; }

        .field { margin-bottom: 14px; }
        .field label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .field label button { background: none; border: none; color: var(--sf); font-size: 13px; font-weight: 600; padding: 0; }
        .field input { width: 100%; height: 48px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; color: var(--ink); outline: none; }
        .field input:focus { background: #fff; border-color: var(--sf); }

        /* ---------- Toast / Loading ---------- */
        #toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 28px); transform: translate(-50%, 16px); background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; white-space: nowrap; }
        #toast.is-show { opacity: 1; transform: translate(-50%, 0); }
        #loadingOverlay { position: fixed; inset: 0; background: rgba(243,246,250,.9); z-index: 80; flex-direction: column; justify-content: center; align-items: center; gap: 14px; color: var(--sf); font-weight: 600; }
        .spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--sf-tint-2); border-top-color: var(--sf); animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } * { transition: none !important; } }
    </style>
</head>
<body>

    <!-- เมนูหลัก -->
    <div id="menuScreen" class="screen">
        <div class="brand">
            <img src="/icon.jpg" alt="SF">
            <div>
                <h1>SF Stock</h1>
                <p id="todayLabel">นับสต็อกประจำวัน</p>
            </div>
        </div>
        <div class="user-row">
            <span>สวัสดี <b id="userNick">-</b><span class="role-tag" id="userRole">พนักงาน</span></span>
        </div>
        <p class="section-label">เลือกพื้นที่ที่จะนับ</p>
        <div class="tiles">
            <button onclick="openZone('back')" class="tile primary">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-5 9 5v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 20v-7h8v7"/></svg></span>
                <span><span class="t" style="display:block">หลังร้าน</span><span class="s" style="display:block">Syrup · Component · Daily</span></span>
            </button>
            <button onclick="openZone('front')" class="tile">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h16l-1.5-5h-13z"/><path d="M5 10v10h14V10M9 20v-5h6v5"/></svg></span>
                <span><span class="t" style="display:block">หน้าร้าน</span><span class="s" style="display:block">C1 · C2 · C3 · ตัวโชว์</span></span>
            </button>
            <button onclick="openZone('booth')" class="tile">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16v12H4zM2 8l3-4h14l3 4"/><path d="M9 13h6"/></svg></span>
                <span><span class="t" style="display:block">Booth</span><span class="s" style="display:block">บูธขาย</span></span>
            </button>
            <button onclick="openZone('main')" class="tile">
                <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg></span>
                <span><span class="t" style="display:block">MAIN</span><span class="s" style="display:block">สต็อกหลัก</span></span>
            </button>
        </div>
    </div>

    <!-- เมนูย่อยหลังร้าน -->
    <div id="backSubMenuScreen" class="hidden screen">
        <button onclick="goBackToMainMenu()" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>เมนูหลัก</button>
        <h2 class="sub-title">หลังร้าน</h2>
        <p class="sub-desc">เลือกหมวดที่จะนับ</p>
        <div class="list">
            <button onclick="openBackSubZone('back_syrup')" class="list-row"><span class="badge">S</span><span class="lbl">Syrup &amp; CO2<small>ชั่งน้ำหนักแล้วคำนวณให้อัตโนมัติ</small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            <button onclick="openBackSubZone('back_component')" class="list-row"><span class="badge">C</span><span class="lbl">Component<small>ข้าวโพด น้ำมัน ผงปรุงรส</small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            <button onclick="openBackSubZone('back_daily')" class="list-row"><span class="badge">D</span><span class="lbl">Daily<small>แก้ว ฝา ถัง ถุง</small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
    </div>

    <!-- เมนูย่อยหน้าร้าน -->
    <div id="frontSubMenuScreen" class="hidden screen">
        <button onclick="goBackToMainMenu()" class="back-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg>เมนูหลัก</button>
        <h2 class="sub-title">หน้าร้าน</h2>
        <p class="sub-desc">เลือกเครื่องที่จะนับ</p>
        <div class="list">
            <button onclick="openFrontSubZone(1)" class="list-row"><span class="badge">C1</span><span class="lbl">เครื่อง 1</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            <button onclick="openFrontSubZone(2)" class="list-row"><span class="badge">C2</span><span class="lbl">เครื่อง 2</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            <button onclick="openFrontSubZone(3)" class="list-row"><span class="badge">C3</span><span class="lbl">เครื่อง 3</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
            <button onclick="openFrontSubZone('show')" class="list-row"><span class="badge">★</span><span class="lbl">ตัวโชว์</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
    </div>

    <!-- หน้านับสต็อก -->
    <div id="appScreen" class="hidden">
        <div class="app-head">
            <div class="app-head-row">
                <button onclick="goBackMenu()" class="head-btn" aria-label="กลับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
                <h1 id="zoneTitle">...</h1>
                <button onclick="openAddProductModal()" class="head-btn add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>เพิ่ม</button>
            </div>
            <div class="search-row">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                    <input type="text" id="q" placeholder="ค้นหาชื่อหรือบาร์โค้ด">
                </div>
                <button onclick="startScan('search')" class="scan-btn" aria-label="สแกนบาร์โค้ด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></button>
            </div>
            <div class="status-row" role="tablist" aria-label="กรองตามสถานะ">
                <button class="chip todo" data-f="todo" onclick="setStatusFilter('todo')">ยังไม่นับ <b id="cnt-todo">0</b></button>
                <button class="chip done" data-f="done" onclick="setStatusFilter('done')">นับแล้ว <b id="cnt-done">0</b></button>
                <button class="chip" data-f="all" onclick="setStatusFilter('all')">ทั้งหมด <b id="cnt-all">0</b></button>
            </div>
            <div class="progress" id="progressBox">
                <div class="bar"><div class="fill" id="progressFill"></div></div>
                <span id="progressText">0%</span>
            </div>
        </div>
        <div id="groups"></div>
    </div>

    <!-- Modal กรอกตัวเลข / คำนวณ -->
    <div id="smartModal" class="hidden overlay">
        <div class="sheet">
            <button onclick="closeSmartModal()" class="x-btn" aria-label="ปิด">&times;</button>
            <h3 id="modalTitle">คำนวณ</h3>
            <div id="modalContent"></div>
            <button onclick="saveSmartValue()" class="btn-main">ยืนยัน</button>
        </div>
    </div>

    <!-- Modal เพิ่มสินค้า -->
    <div id="addProductModal" class="hidden overlay">
        <div class="sheet">
            <button onclick="closeAddProductModal()" class="x-btn" aria-label="ปิด">&times;</button>
            <h3>เพิ่มสินค้าใหม่</h3>
            <div class="field">
                <label for="new_group">หมวดหมู่</label>
                <input type="text" id="new_group" placeholder="เช่น CON-STD FG Beverage" onfocus="isEditingField=true" onblur="isEditingField=false">
            </div>
            <div class="field">
                <label for="new_name">ชื่อสินค้า</label>
                <input type="text" id="new_name" placeholder="ระบุชื่อสินค้า" onfocus="isEditingField=true" onblur="isEditingField=false">
            </div>
            <div class="field">
                <label for="new_sku"><span>บาร์โค้ด (SKU)</span><button type="button" onclick="startScan('sku')">สแกน</button></label>
                <input type="text" id="new_sku" inputmode="numeric" placeholder="ตัวเลขบาร์โค้ด" onfocus="isEditingField=true" onblur="isEditingField=false">
            </div>
            <div class="field">
                <label for="new_unit">บรรจุต่อลัง (ชิ้น)</label>
                <input type="number" id="new_unit" inputmode="decimal" value="1" onfocus="isEditingField=true" onblur="isEditingField=false">
            </div>
            <div class="field" id="adminPwField">
                <label for="new_admin_pw">รหัสแอดมิน (ต้องให้แอดมินยืนยัน)</label>
                <input type="password" id="new_admin_pw" autocomplete="off" onfocus="isEditingField=true" onblur="isEditingField=false">
            </div>
            <button onclick="saveNewProduct()" class="btn-main" style="margin-top:6px;">บันทึกสินค้า</button>
        </div>
    </div>

    <!-- Modal สแกน -->
    <div id="scanModal" class="hidden overlay" style="z-index:60; background:rgba(15,30,51,.85);">
        <div class="sheet">
            <button onclick="closeScan()" class="x-btn" aria-label="ปิด">&times;</button>
            <h3>สแกนบาร์โค้ด</h3>
            <div id="reader" style="width:100%; border-radius:12px; overflow:hidden;"></div>
        </div>
    </div>

    <div id="syncPill" role="status"><span class="dot"></span><span id="syncText"></span></div>
    <div id="toast"></div>
    <div id="loadingOverlay" class="hidden">
        <div class="spinner"></div>
        <div>กำลังโหลด...</div>
    </div>

    <script src="/mobile/mobile.js"></script>
</body>
</html>
